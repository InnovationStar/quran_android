name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2️⃣ Setup JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Clean Gradle state (IMPORTANT FIX)
      - name: Clean Gradle state
        run: |
          ./gradlew clean || true
          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/daemon

      # 4️⃣ Cache Gradle
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # 5️⃣ Decode upload keystore
      - name: Decode upload keystore
        run: |
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > upload-keystore.jks
          ls -l upload-keystore.jks
          keytool -list -keystore upload-keystore.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }}

      # 6️⃣ Decode google-services.json
      - name: Decode google-services.json
        run: |
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          jq . app/google-services.json

      # 7️⃣ Make gradlew executable
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 8️⃣ Get ONLY app bundle tasks (FIXED OUTPUT BUG)
      - name: List app release bundle tasks
        id: list_tasks
        run: |
          echo "Fetching tasks..."
          TASKS=$(./gradlew tasks --all | grep '^app:bundle.*Release$' | awk '{print $1}' | tr '\n' ' ')
          echo "tasks=$TASKS" >> $GITHUB_OUTPUT
          echo "Found tasks: $TASKS"

      # 9️⃣ Build AAB bundles (FIXED SIGNING ISSUE)
      - name: Build app release bundles
        if: steps.list_tasks.outputs.tasks != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for task in ${{ steps.list_tasks.outputs.tasks }}; do
            echo "Building $task..."

            ./gradlew $task \
              -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/upload-keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace --console=plain --no-daemon
          done

      # 🔟 Upload AAB artifacts
      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: app/build/outputs/bundle/**/*.aab
