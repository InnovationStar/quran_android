name: Android Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper/
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Decode upload keystore
        run: |
          mkdir -p app
          echo "${{ secrets.UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > app/upload-keystore.jks
          keytool -list -keystore app/upload-keystore.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Decode google-services.json
        run: |
          mkdir -p app
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
          jq . app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: List app release bundle tasks
        id: list_tasks
        run: |
          TASKS=$(./gradlew tasks --all | grep '^app:bundle.*Release$' | awk '{print $1}')
          echo "tasks=$TASKS" >> $GITHUB_OUTPUT

      - name: Build app release bundles
        if: steps.list_tasks.outputs.tasks != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for task in ${{ steps.list_tasks.outputs.tasks }}; do
            ./gradlew $task \
              -Pandroid.injected.signing.store.file=app/upload-keystore.jks \
              -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
              -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
              -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
              --stacktrace
          done

      - name: Upload AAB artifacts
        uses: actions/upload-artifact@v5
        with:
          name: android-aab
          path: app/build/outputs/bundle/**/*.aab
